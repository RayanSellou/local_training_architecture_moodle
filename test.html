<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test de Recherche</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        th, td {
            padding: 8px;
        }
    </style>
</head>
<body>

    <input type="text" id="search-input" placeholder="Rechercher...">
    <div id="levels-table-container">
        <table>
            <thead>
                <tr>
                    <th>Nom</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>aaa</td></tr>
                <tr><td>aba</td></tr>
                <tr><td>aca</td></tr>
                <tr><td>ada</td></tr>
                <tr><td>afa</td></tr>
                <tr><td>informatique</td></tr>
                <tr><td>info</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        function removeAccents(str) {
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        }

        document.addEventListener("DOMContentLoaded", function() {
            const searchInput = document.getElementById("search-input");

            searchInput.addEventListener("keyup", function() {
                const filter = removeAccents(searchInput.value);
                const rows = document.querySelectorAll("#levels-table-container table tbody tr");

                console.log("Filtre :", filter);

                rows.forEach(function(row) {
                    let textContent = "";

                    row.querySelectorAll("td").forEach(function(cell) {
                        const cellText = removeAccents(cell.textContent);
                        textContent += cellText + " ";
                        console.log("Texte de la cellule :", cellText);
                    });

                    console.log("Texte de la ligne complète :", textContent);

                    if (textContent.includes(filter)) {
                        row.style.display = "";
                        console.log("✅ Ligne visible :", textContent);
                    } else {
                        row.style.display = "none";
                        console.log("❌ Ligne masquée :", textContent);
                    }
                });
            });
        });
    </script>

</body>
</html>
